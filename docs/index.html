<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XGBoost Visualized</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #080915;
      font-family: Inter, system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      opacity: 0.9;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #38bdf8;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 1rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading XGBoost visualizer…</div>
  </div>

  <script>
    fetch('https://raw.githubusercontent.com/rshekhar93/My_Notebooks/master/xgboost-visualizer.html')
      .then(response => {
        if (!response.ok) throw new Error('Failed to fetch page content');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = '<div style="padding:2rem;color:#fff;">Unable to load the visualizer. Please make sure the source file exists in the repository.</div>';
      });
  </script>
</body>
</html>
